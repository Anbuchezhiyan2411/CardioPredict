{% extends "base.html" %}

{% block title %}Error {{ error_code }} — CardioPredict{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="custom-card p-5 shadow-lg border-0">
                <div class="text-danger mb-3" style="font-size: 4rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h1 class="display-5 fw-bold mb-2 text-dark">{{ error_code }}</h1>
                <h4 class="fw-bold mb-3 text-secondary">{{ error_title }}</h4>
                <p class="text-muted mb-4">
                    {{ error_message }}
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('home') }}" class="btn btn-primary-custom px-4">
                        <i class="bi bi-house-door me-2"></i> Return to Home
                    </a>
                    <a href="{{ url_for('predict') }}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-clipboard2-pulse me-2"></i> Clinical Assessment
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
